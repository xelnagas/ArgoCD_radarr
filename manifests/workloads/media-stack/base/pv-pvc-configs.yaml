# ==============================================================================
# PersistentVolumes & Claims pour les configurations des applications Servarr
# ==============================================================================

# --- qBittorrent Config ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-config-pv
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: qbittorrent-config-pv
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /stockage/k8s-servarr-config/qbittorrent
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - linux2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: qbittorrent-config-pvc
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  volumeName: qbittorrent-config-pv
  resources:
    requests:
      storage: 10Gi
---
