apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/instance: prowlarr-prod
    app.kubernetes.io/component: indexer-manager
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/managed-by: argocd
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: 9696
      protocol: TCP
