apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: media-stack
    app.kubernetes.io/part-of: media-stack
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/xelnagas/ArgoCD_radarr.git
    targetRevision: main
    path: manifests/workloads/media-stack/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
